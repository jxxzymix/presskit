name: Deploy JXXZY racing site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        run: |
          node --check assets/racing.js
          node --check assets/catalog.js
          node --check assets/experience.js
          test -s assets/JXXZY_PRESSKIT_2026_RACING_V3.pdf
          python3 hydrate_assets.py
          python3 check_site.py --require-assets
      - uses: actions/configure-pages@v5
      - name: Stage site
        run: |
          mkdir _site
          rsync -a --exclude .git --exclude .github --exclude _site --exclude '*.py' --exclude '*.bat' --exclude '*.md' --exclude '*.dxv' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
